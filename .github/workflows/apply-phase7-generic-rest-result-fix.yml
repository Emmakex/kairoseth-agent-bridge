name: Apply Phase 7 Generic REST Result Fix

on:
  push:
    branches:
      - phase7/generic-rest-result-contract
    paths:
      - .github/workflows/apply-phase7-generic-rest-result-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: phase7/generic-rest-result-contract
          fetch-depth: 0

      - name: Align Phase 7 status parser with Generic REST result contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/acceptance/phase7-real-platform.ts')
          text = source.read_text()
          old = '''function orderStatusFromOutput(output: unknown): string | null {\n  const status = record(output)?.status;\n  return typeof status === "string" && ORDER_STATUSES.has(status) ? status : null;\n}'''
          new = '''function orderStatusFromOutput(output: unknown): string | null {\n  const result = record(output);\n  const body = record(result?.body);\n  const status = body?.status;\n  return result?.ok === true && typeof status === "string" && ORDER_STATUSES.has(status)\n    ? status\n    : null;\n}'''
          if old not in text:
              raise SystemExit('orderStatusFromOutput marker not found')
          source.write_text(text.replace(old, new, 1))

          test = Path('tests/acceptance/phase7-real-platform-runner.test.ts')
          text = test.read_text()
          replacements = {
              'output: { id: 42, status: "processing" }': 'output: { status: 200, ok: true, body: { id: 42, status: "processing" } }',
              'output: { id: 42, status: "completed" }': 'output: { status: 200, ok: true, body: { id: 42, status: "completed" } }',
              'output: { status: "processing" }': 'output: { status: 200, ok: true, body: { status: "processing" } }',
              'output: { status: "completed" }': 'output: { status: 200, ok: true, body: { status: "completed" } }',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'test fixture marker not found: {old}')
              text = text.replace(old, new)
          test.write_text(text)
          PY

      - name: Verify regression
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const body = record(result?.body);' src/acceptance/phase7-real-platform.ts
          grep -Fq 'result?.ok === true' src/acceptance/phase7-real-platform.ts
          grep -Fq 'body: { id: 42, status: "processing" }' tests/acceptance/phase7-real-platform-runner.test.ts
          grep -Fq 'body: { id: 42, status: "completed" }' tests/acceptance/phase7-real-platform-runner.test.ts
          npm ci --no-audit --no-fund
          npm run check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/acceptance/phase7-real-platform.ts tests/acceptance/phase7-real-platform-runner.test.ts
          git commit -m "fix(phase7): read WooCommerce status from Generic REST body"
          git push origin HEAD:phase7/generic-rest-result-contract
