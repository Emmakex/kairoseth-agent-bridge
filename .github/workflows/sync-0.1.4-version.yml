name: Sync 0.1.4 Package Metadata

on:
  push:
    branches:
      - release/0.1.4-phase7
    paths:
      - .github/workflows/sync-0.1.4-version.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.1.4-phase7
          fetch-depth: 0

      - name: Synchronize package metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.1.4 --no-git-tag-version --allow-same-version
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!=='0.1.4'||l.version!=='0.1.4'||l.packages?.['']?.version!=='0.1.4')process.exit(1)"

      - name: Commit synchronized metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "release: bump package metadata to 0.1.4"
          git push origin HEAD:release/0.1.4-phase7
