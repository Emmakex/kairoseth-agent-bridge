name: OCI SBOM Diagnostic

on:
  pull_request:
    paths:
      - "scripts/**"
      - "packaging/docker/**"
      - ".github/workflows/oci-sbom-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build diagnostic OCI layout
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p diagnostic/context/dist diagnostic/layout
          cp package.json package-lock.json diagnostic/context/
          cp -R dist/src diagnostic/context/dist/src
          docker buildx build \
            --platform linux/amd64 \
            --file packaging/docker/Dockerfile.release \
            --build-arg "KAB_VERSION=${VERSION}" \
            --build-arg "KAB_REVISION=${GITHUB_SHA}" \
            --provenance=false \
            --sbom=true \
            --output "type=oci,dest=diagnostic/image.oci.tar,name=agent-bridge:${VERSION}" \
            diagnostic/context
          tar -xf diagnostic/image.oci.tar -C diagnostic/layout
          node scripts/summarize-oci-attestations.mjs \
            diagnostic/layout diagnostic/attestations-summary.json
          set +e
          node scripts/extract-oci-sbom.mjs \
            diagnostic/layout diagnostic/oci-sbom.spdx.json linux amd64 \
            > diagnostic/extractor-output.json \
            2> diagnostic/extractor-error.txt
          STATUS=$?
          set -e
          printf '%s\n' "$STATUS" > diagnostic/extractor-status.txt

      - name: Upload OCI diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: oci-sbom-diagnostic-${{ github.sha }}
          path: |
            diagnostic/attestations-summary.json
            diagnostic/extractor-output.json
            diagnostic/extractor-error.txt
            diagnostic/extractor-status.txt
          if-no-files-found: error
          retention-days: 1
