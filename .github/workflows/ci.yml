name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated lockfile once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: add reproducible npm lockfile'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Typecheck, test and build
        run: npm run check

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > sbom.cdx.json

      - name: Validate SBOM
        run: >-
          node -e 'const fs=require("node:fs"); const sbom=JSON.parse(fs.readFileSync("sbom.cdx.json","utf8"));
          if(sbom.bomFormat!=="CycloneDX"||!Array.isArray(sbom.components)) process.exit(1);'

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-bridge-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
