name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck, test and build
        run: npm run check

      - name: Build and inspect Docker runtime
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          docker build \
            --build-arg KAB_VERSION="$VERSION" \
            --build-arg KAB_REVISION="$GITHUB_SHA" \
            --tag agent-bridge:ci \
            .
          test "$(docker image inspect agent-bridge:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect agent-bridge:ci --format '{{json .Config.ExposedPorts}}')" = "null"
          test "$(docker image inspect agent-bridge:ci --format '{{json .Config.Healthcheck.Test}}')" != "null"
          docker run --rm --entrypoint node agent-bridge:ci \
            -e "import('./dist/src/index.js').then((m) => { if (!m.ProductionRuntime || !m.FileRuntimeProcessStatusStore) process.exit(1); })"

      - name: Build release image from prebuilt runtime
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          rm -rf .ci-release-context
          mkdir -p .ci-release-context/dist
          cp package.json package-lock.json .ci-release-context/
          cp -R dist/src .ci-release-context/dist/src
          docker build \
            --file packaging/docker/Dockerfile.release \
            --build-arg KAB_VERSION="$VERSION" \
            --build-arg KAB_REVISION="$GITHUB_SHA" \
            --tag agent-bridge:release-ci \
            .ci-release-context
          test "$(docker image inspect agent-bridge:release-ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect agent-bridge:release-ci --format '{{json .Config.ExposedPorts}}')" = "null"
          test "$(docker image inspect agent-bridge:release-ci --format '{{json .Config.Healthcheck.Test}}')" != "null"
          docker run --rm --entrypoint node agent-bridge:release-ci \
            -e "import('./dist/src/index.js').then((m) => { if (!m.ProductionRuntime || !m.buildDockerRuntimeActivationPlan) process.exit(1); })"

      - name: Run installed Docker rollback drill
        run: bash tests/acceptance/docker-installed-rollback.sh

      - name: Build and inspect Linux systemd bundle
        run: |
          set -euo pipefail
          bash -n packaging/linux/install-bundle.sh
          bash -n packaging/linux/activate-with-rollback.sh
          bash -n scripts/build-linux-service-bundle.sh
          VERSION="$(node -p "require('./package.json').version")"
          RUNTIME_SHA="$(printf 'd%.0s' {1..64})"
          bash scripts/build-linux-service-bundle.sh \
            "$VERSION" \
            "$GITHUB_SHA" \
            "$RUNTIME_SHA" \
            .ci-agent-bridge-linux-x64.tar.gz >/dev/null
          BUNDLE_LISTING="${RUNNER_TEMP}/agent-bridge-linux-bundle.list"
          tar -tzf .ci-agent-bridge-linux-x64.tar.gz > "$BUNDLE_LISTING"
          grep -q '/runtime-release.json$' "$BUNDLE_LISTING"
          grep -q '/dist/src/cli/agent-bridge-runtime.js$' "$BUNDLE_LISTING"
          grep -q '/packaging/linux/agent-bridge.service$' "$BUNDLE_LISTING"
          grep -q '/node_modules/' "$BUNDLE_LISTING"

      - name: Run installed Linux rollback drill
        run: bash tests/acceptance/linux-service-packaging.sh

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > sbom.cdx.json

      - name: Validate SBOM
        run: >-
          node -e 'const fs=require("node:fs"); const sbom=JSON.parse(fs.readFileSync("sbom.cdx.json","utf8"));
          if(sbom.bomFormat!=="CycloneDX"||!Array.isArray(sbom.components)) process.exit(1);'

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload SBOM
        if: ${{ always() && hashFiles('sbom.cdx.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-bridge-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
