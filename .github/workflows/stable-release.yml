name: Stable Release Promotion

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: stable-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote verified stable release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and verify signed annotated tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          REF_TYPE="$(jq -r '.object.type' <<<"$REF_JSON")"
          TAG_OBJECT_SHA="$(jq -r '.object.sha' <<<"$REF_JSON")"

          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "Stable promotion requires an annotated tag; lightweight tags are rejected." >&2
            exit 1
          fi

          TAG_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}")"
          if [[ "$(jq -r '.verification.verified' <<<"$TAG_JSON")" != "true" ]]; then
            echo "Stable promotion requires a tag signature verified by GitHub." >&2
            exit 1
          fi
          if [[ "$(jq -r '.object.type' <<<"$TAG_JSON")" != "commit" ]]; then
            echo "Stable promotion tag must point directly to a commit." >&2
            exit 1
          fi

          SOURCE_SHA="$(jq -r '.object.sha' <<<"$TAG_JSON")"
          git fetch origin main --force
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "Stable promotion source commit must already belong to main." >&2
            exit 1
          fi

          git checkout --detach "$SOURCE_SHA"
          echo "STABLE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "STABLE_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked tooling dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate stable tag and package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          npx --no-install tsx --eval '
            import { validateStableReleaseIdentity } from "./src/update/stable-release-policy.ts";
            validateStableReleaseIdentity(process.argv[1], process.argv[2]);
          ' "$STABLE_TAG" "$VERSION"
          echo "STABLE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Refuse an existing immutable GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release ${STABLE_TAG} already exists; stable releases are not mutated in place." >&2
            exit 1
          fi

      - name: Locate successful Release Integrity source run
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release-integrity.yml/runs?head_sha=${STABLE_SOURCE_SHA}&branch=main&event=push&status=success&per_page=100" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty'
          )"
          if [[ -z "$RUN_ID" ]]; then
            echo "No successful main Release Integrity run exists for ${STABLE_SOURCE_SHA}." >&2
            exit 1
          fi

          EXPECTED_ARTIFACT="agent-bridge-${STABLE_VERSION}-${STABLE_SOURCE_SHA:0:12}"
          ARTIFACT_COUNT="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"${EXPECTED_ARTIFACT}\" and .expired == false)] | length"
          )"
          if [[ "$ARTIFACT_COUNT" != "1" ]]; then
            echo "Expected exactly one non-expired Release Integrity artifact named ${EXPECTED_ARTIFACT}." >&2
            exit 1
          fi

          echo "SOURCE_RELEASE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "SOURCE_RELEASE_ARTIFACT=$EXPECTED_ARTIFACT" >> "$GITHUB_ENV"

      - name: Locate successful Windows Service source run
        shell: bash
        run: |
          set -euo pipefail
          WINDOWS_RUN_ID="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/windows-service.yml/runs?head_sha=${STABLE_SOURCE_SHA}&branch=main&event=push&status=success&per_page=100" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty'
          )"
          if [[ -z "$WINDOWS_RUN_ID" ]]; then
            echo "No successful main Windows Service Packaging run exists for ${STABLE_SOURCE_SHA}." >&2
            exit 1
          fi

          EXPECTED_WINDOWS_ARTIFACT="agent-bridge-${STABLE_VERSION}-${STABLE_SOURCE_SHA:0:12}-windows-x64"
          WINDOWS_ARTIFACT_COUNT="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WINDOWS_RUN_ID}/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"${EXPECTED_WINDOWS_ARTIFACT}\" and .expired == false)] | length"
          )"
          if [[ "$WINDOWS_ARTIFACT_COUNT" != "1" ]]; then
            echo "Expected exactly one non-expired Windows artifact named ${EXPECTED_WINDOWS_ARTIFACT}." >&2
            exit 1
          fi

          echo "SOURCE_WINDOWS_RUN_ID=$WINDOWS_RUN_ID" >> "$GITHUB_ENV"
          echo "SOURCE_WINDOWS_ARTIFACT=$EXPECTED_WINDOWS_ARTIFACT" >> "$GITHUB_ENV"

      - name: Download exact verified Release Integrity bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stable-source
          mkdir -p stable-source
          gh run download "$SOURCE_RELEASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_RELEASE_ARTIFACT" \
            --dir stable-source

          MANIFEST="$(find stable-source -type f -name release-manifest.json -print -quit)"
          if [[ -z "$MANIFEST" ]]; then
            echo "Downloaded Release Integrity artifact has no release-manifest.json." >&2
            exit 1
          fi
          ROOT="$(dirname "$MANIFEST")"
          echo "STABLE_RELEASE_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Download exact verified Windows bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stable-windows
          mkdir -p stable-windows
          gh run download "$SOURCE_WINDOWS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_WINDOWS_ARTIFACT" \
            --dir stable-windows

          WINDOWS_EVIDENCE="$(find stable-windows -type f -name windows-service-evidence.json -print -quit)"
          if [[ -z "$WINDOWS_EVIDENCE" ]]; then
            echo "Downloaded Windows artifact has no windows-service-evidence.json." >&2
            exit 1
          fi
          WINDOWS_ROOT="$(dirname "$WINDOWS_EVIDENCE")"
          echo "STABLE_WINDOWS_ROOT=$WINDOWS_ROOT" >> "$GITHUB_ENV"

      - name: Verify manifest, checksums and source identity
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$STABLE_RELEASE_ROOT"
          MANIFEST="$ROOT/release-manifest.json"
          node --input-type=module - "$MANIFEST" "$STABLE_VERSION" "$STABLE_SOURCE_SHA" <<'NODE'
          import fs from "node:fs";
          const [manifestPath, version, sourceCommit] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          if (manifest.schemaVersion !== 1) throw new Error("Unsupported release manifest schema.");
          if (manifest.technicalProductId !== "agent-bridge") throw new Error("Unexpected technical product ID.");
          if (manifest.packageVersion !== version) throw new Error("Release manifest version does not match stable tag.");
          if (manifest.sourceCommit !== sourceCommit) throw new Error("Release manifest source commit does not match signed tag target.");
          if (!manifest.artifact?.file || !manifest.linuxService?.file || !manifest.ociImage?.file) {
            throw new Error("Stable promotion requires runtime, Linux and OCI Release Integrity surfaces.");
          }
          if (!/^sha256:[a-f0-9]{64}$/i.test(manifest.ociImage.exportDigest ?? "")) {
            throw new Error("Release manifest OCI export digest is invalid.");
          }
          NODE
          (
            cd "$ROOT"
            sha256sum --check SHA256SUMS
          )

      - name: Verify Windows evidence, checksum and source identity
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$STABLE_WINDOWS_ROOT"
          EVIDENCE="$ROOT/windows-service-evidence.json"
          node --input-type=module - "$EVIDENCE" "$STABLE_VERSION" "$STABLE_SOURCE_SHA" <<'NODE'
          import fs from "node:fs";
          const [evidencePath, version, sourceCommit] = process.argv.slice(2);
          const evidence = JSON.parse(fs.readFileSync(evidencePath, "utf8"));
          if (evidence.schemaVersion !== "kab.windows-service-evidence.v1") throw new Error("Unsupported Windows service evidence schema.");
          if (evidence.technicalProductId !== "agent-bridge") throw new Error("Unexpected Windows technical product ID.");
          if (evidence.packageVersion !== version) throw new Error("Windows package version does not match stable tag.");
          if (evidence.sourceCommit !== sourceCommit) throw new Error("Windows source commit does not match signed tag target.");
          if (evidence.platform !== "windows/x64/service") throw new Error("Unexpected Windows service platform.");
          if (typeof evidence.file !== "string" || !evidence.file.endsWith("-windows-x64.zip")) throw new Error("Windows bundle filename is invalid.");
          if (typeof evidence.sha256 !== "string" || !/^[a-f0-9]{64}$/i.test(evidence.sha256)) throw new Error("Windows bundle SHA-256 is invalid.");
          if (evidence.serviceWrapper?.name !== "WinSW" || evidence.serviceWrapper?.version !== "2.12.0") throw new Error("Unexpected Windows service wrapper identity.");
          if (evidence.serviceWrapper?.sha256 !== "05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da") throw new Error("WinSW SHA-256 does not match the pinned wrapper.");
          NODE

          WINDOWS_FILE="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).file' "$EVIDENCE")"
          WINDOWS_SHA256="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).sha256' "$EVIDENCE")"
          test -f "$ROOT/$WINDOWS_FILE"
          (
            cd "$ROOT"
            printf '%s  %s\n' "$WINDOWS_SHA256" "$WINDOWS_FILE" | sha256sum --check -
          )
          echo "STABLE_WINDOWS_FILE=$WINDOWS_FILE" >> "$GITHUB_ENV"

      - name: Verify exact Release Integrity provenance
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$STABLE_RELEASE_ROOT"
          MANIFEST="$ROOT/release-manifest.json"
          RUNTIME_FILE="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).artifact.file' "$MANIFEST")"
          LINUX_FILE="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).linuxService.file' "$MANIFEST")"
          OCI_FILE="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).ociImage.file' "$MANIFEST")"
          SIGNER_WORKFLOW="$GITHUB_REPOSITORY/.github/workflows/release-integrity.yml"

          for FILE in "$RUNTIME_FILE" "$LINUX_FILE" "$OCI_FILE"; do
            test -f "$ROOT/$FILE"
            gh attestation verify "$ROOT/$FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$STABLE_SOURCE_SHA" \
              --source-ref refs/heads/main
          done

      - name: Verify exact Windows service provenance
        shell: bash
        run: |
          set -euo pipefail
          WINDOWS_FILE="$STABLE_WINDOWS_ROOT/$STABLE_WINDOWS_FILE"
          test -f "$WINDOWS_FILE"
          gh attestation verify "$WINDOWS_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/windows-service.yml" \
            --source-digest "$STABLE_SOURCE_SHA" \
            --source-ref refs/heads/main

      - name: Install OCI registry transfer tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          skopeo --version

      - name: Promote exact OCI archive to GHCR
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$STABLE_RELEASE_ROOT"
          MANIFEST="$ROOT/release-manifest.json"
          OCI_FILE="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).ociImage.file' "$MANIFEST")"
          EXPECTED_DIGEST="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).ociImage.exportDigest' "$MANIFEST")"
          REGISTRY_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          TARGET_REF="${REGISTRY_REPOSITORY}:${STABLE_VERSION}"

          test -f "$ROOT/$OCI_FILE"
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[a-fA-F0-9]{64}$ ]]

          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'skopeo logout ghcr.io >/dev/null 2>&1 || true' EXIT

          EXISTING_DIGEST=""
          if EXISTING_DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://$TARGET_REF" 2>/dev/null)"; then
            if [[ "${EXISTING_DIGEST,,}" != "${EXPECTED_DIGEST,,}" ]]; then
              echo "Registry tag ${TARGET_REF} already exists with digest ${EXISTING_DIGEST}; expected ${EXPECTED_DIGEST}." >&2
              exit 1
            fi
            echo "Registry tag already points to the exact verified digest; promotion is a no-op."
          else
            skopeo copy \
              --all \
              --preserve-digests \
              --digestfile "${RUNNER_TEMP}/agent-bridge-registry-digest.txt" \
              "oci-archive:$ROOT/$OCI_FILE" \
              "docker://$TARGET_REF"
          fi

          PROMOTED_DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://$TARGET_REF")"
          if [[ "${PROMOTED_DIGEST,,}" != "${EXPECTED_DIGEST,,}" ]]; then
            echo "Registry digest ${PROMOTED_DIGEST} does not match verified OCI export digest ${EXPECTED_DIGEST}." >&2
            exit 1
          fi

          echo "STABLE_REGISTRY_IMAGE=$REGISTRY_REPOSITORY" >> "$GITHUB_ENV"
          echo "STABLE_REGISTRY_REF=$TARGET_REF" >> "$GITHUB_ENV"
          echo "STABLE_REGISTRY_DIGEST=${PROMOTED_DIGEST,,}" >> "$GITHUB_ENV"

      - name: Create stable promotion manifest
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$STABLE_RELEASE_ROOT"
          RELEASE_MANIFEST_SHA256="$(sha256sum "$ROOT/release-manifest.json" | awk '{print $1}')"
          WINDOWS_EVIDENCE_SHA256="$(sha256sum "$STABLE_WINDOWS_ROOT/windows-service-evidence.json" | awk '{print $1}')"
          STABLE_TAG="$STABLE_TAG" \
          STABLE_VERSION="$STABLE_VERSION" \
          STABLE_SOURCE_SHA="$STABLE_SOURCE_SHA" \
          SOURCE_RELEASE_RUN_ID="$SOURCE_RELEASE_RUN_ID" \
          SOURCE_RELEASE_ARTIFACT="$SOURCE_RELEASE_ARTIFACT" \
          SOURCE_WINDOWS_RUN_ID="$SOURCE_WINDOWS_RUN_ID" \
          SOURCE_WINDOWS_ARTIFACT="$SOURCE_WINDOWS_ARTIFACT" \
          RELEASE_MANIFEST_SHA256="$RELEASE_MANIFEST_SHA256" \
          WINDOWS_EVIDENCE_SHA256="$WINDOWS_EVIDENCE_SHA256" \
          STABLE_REGISTRY_IMAGE="$STABLE_REGISTRY_IMAGE" \
          STABLE_REGISTRY_REF="$STABLE_REGISTRY_REF" \
          STABLE_REGISTRY_DIGEST="$STABLE_REGISTRY_DIGEST" \
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const promotion = {
            schemaVersion: "kab.stable-promotion.v1",
            technicalProductId: "agent-bridge",
            channel: "stable",
            tag: process.env.STABLE_TAG,
            packageVersion: process.env.STABLE_VERSION,
            sourceCommit: process.env.STABLE_SOURCE_SHA,
            sourceReleaseIntegrityRunId: Number(process.env.SOURCE_RELEASE_RUN_ID),
            sourceArtifact: process.env.SOURCE_RELEASE_ARTIFACT,
            sourceReleaseIntegrityArtifact: process.env.SOURCE_RELEASE_ARTIFACT,
            sourceWindowsServiceRunId: Number(process.env.SOURCE_WINDOWS_RUN_ID),
            sourceWindowsServiceArtifact: process.env.SOURCE_WINDOWS_ARTIFACT,
            releaseManifestSha256: process.env.RELEASE_MANIFEST_SHA256,
            windowsServiceEvidenceSha256: process.env.WINDOWS_EVIDENCE_SHA256,
            registry: {
              image: process.env.STABLE_REGISTRY_IMAGE,
              ref: process.env.STABLE_REGISTRY_REF,
              digest: process.env.STABLE_REGISTRY_DIGEST,
            },
            promotionWorkflow: process.env.GITHUB_WORKFLOW,
            promotionRunId: Number(process.env.GITHUB_RUN_ID),
          };
          fs.writeFileSync("stable-promotion.json", JSON.stringify(promotion, null, 2) + "\n");
          NODE

      - name: Attest stable promotion manifest
        uses: actions/attest@v4
        with:
          subject-path: stable-promotion.json

      - name: Publish immutable GitHub Release surface
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$STABLE_RELEASE_ROOT"
          MANIFEST="$ROOT/release-manifest.json"
          RUNTIME_FILE="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).artifact.file' "$MANIFEST")"
          LINUX_FILE="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).linuxService.file' "$MANIFEST")"
          OCI_FILE="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).ociImage.file' "$MANIFEST")"

          cat > stable-release-notes.md <<EOF
          ## ES
          Release estable de Agent Bridge ${STABLE_VERSION}, promovida sin recompilar desde Release Integrity run ${SOURCE_RELEASE_RUN_ID} y Windows Service Packaging run ${SOURCE_WINDOWS_RUN_ID}. Runtime, Linux, Windows y OCI conservan sus bytes y attestations verificadas. OCI publicado también como `${STABLE_REGISTRY_REF}@${STABLE_REGISTRY_DIGEST}` sin rebuild ni cambio de digest.

          ## EN
          Stable Agent Bridge ${STABLE_VERSION} release, promoted without rebuilding from Release Integrity run ${SOURCE_RELEASE_RUN_ID} and Windows Service Packaging run ${SOURCE_WINDOWS_RUN_ID}. Runtime, Linux, Windows and OCI retain their verified bytes and attestations. OCI is also published as `${STABLE_REGISTRY_REF}@${STABLE_REGISTRY_DIGEST}` without rebuild or digest change.
          EOF

          ASSETS=(
            "$ROOT/$RUNTIME_FILE"
            "$ROOT/$LINUX_FILE"
            "$STABLE_WINDOWS_ROOT/$STABLE_WINDOWS_FILE"
            "$ROOT/$OCI_FILE"
            "$ROOT/SHA256SUMS"
            "$ROOT/release-manifest.json"
            "$STABLE_WINDOWS_ROOT/windows-service-evidence.json"
            "$ROOT/oci-image.json"
            "$ROOT/oci-sbom.spdx.json"
            "$ROOT/sbom.cdx.json"
            "stable-promotion.json"
          )
          for ASSET in "${ASSETS[@]}"; do
            test -f "$ASSET"
          done

          gh release create "$STABLE_TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Agent Bridge ${STABLE_VERSION}" \
            --notes-file stable-release-notes.md
