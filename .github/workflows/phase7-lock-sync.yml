name: Phase 7 lockfile sync

on:
  push:
    branches:
      - phase7/stable-acceptance-release
    paths:
      - package.json
      - .github/workflows/phase7-lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase7/stable-acceptance-release
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Synchronize package-lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: sync package-lock for 0.1.1'
          git push origin HEAD:phase7/stable-acceptance-release
