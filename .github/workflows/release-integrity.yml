name: Release Integrity

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "README.md"
      - "Dockerfile"
      - "packaging/docker/**"
      - "packaging/linux/**"
      - "docs/LINUX_SERVICE_DEPLOYMENT.md"
      - ".github/workflows/release-integrity.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "README.md"
      - "Dockerfile"
      - "packaging/docker/**"
      - "packaging/linux/**"
      - "docs/LINUX_SERVICE_DEPLOYMENT.md"
      - ".github/workflows/release-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-artifact:
    name: Build and attest release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source tree
        run: npm run check

      - name: Generate CycloneDX application SBOM
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > sbom.cdx.json

      - name: Build deterministic runtime archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          NAME="agent-bridge-${VERSION}-${SHORT_SHA}"
          ARCHIVE="release/${NAME}.tar.gz"
          CONTEXT="release/stage/${NAME}"

          mkdir -p "${CONTEXT}/dist"
          cp -R dist/src "${CONTEXT}/dist/src"
          cp package.json package-lock.json README.md "${CONTEXT}/"

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C release/stage \
            -cf - "${NAME}" | gzip -n > "${ARCHIVE}"

          ARTIFACT_SHA256="$(sha256sum "${ARCHIVE}" | awk '{print $1}')"
          SBOM_SHA256="$(sha256sum sbom.cdx.json | awk '{print $1}')"

          printf '%s  %s\n' "${ARTIFACT_SHA256}" "${NAME}.tar.gz" > release/SHA256SUMS
          printf '%s  %s\n' "${SBOM_SHA256}" "sbom.cdx.json" >> release/SHA256SUMS

          VERSION="${VERSION}" \
          ARTIFACT_FILE="${NAME}.tar.gz" \
          ARTIFACT_SHA256="${ARTIFACT_SHA256}" \
          SBOM_SHA256="${SBOM_SHA256}" \
          node -e '
            const fs = require("node:fs");
            const manifest = {
              schemaVersion: 1,
              technicalProductId: "agent-bridge",
              packageVersion: process.env.VERSION,
              sourceCommit: process.env.GITHUB_SHA,
              artifact: {
                file: process.env.ARTIFACT_FILE,
                sha256: process.env.ARTIFACT_SHA256,
              },
              sbom: {
                format: "CycloneDX",
                file: "sbom.cdx.json",
                sha256: process.env.SBOM_SHA256,
                scope: "application-dependencies",
              },
              build: {
                node: process.version,
                workflow: process.env.GITHUB_WORKFLOW,
                runId: process.env.GITHUB_RUN_ID,
                runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              },
            };
            fs.writeFileSync("release/release-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          '

          cp sbom.cdx.json release/sbom.cdx.json

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "artifact-sha256=${ARTIFACT_SHA256}" >> "$GITHUB_OUTPUT"
          echo "context=${CONTEXT}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build deterministic Linux systemd bundle
        id: linux
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.package.outputs.version }}"
          NAME="${{ steps.package.outputs.name }}"
          RUNTIME_ARTIFACT_SHA256="${{ steps.package.outputs.artifact-sha256 }}"
          LINUX_ARCHIVE="release/${NAME}-linux-x64.tar.gz"
          LINUX_CONTEXT="${RUNNER_TEMP}/agent-bridge-linux-bundle-context"
          rm -rf "$LINUX_CONTEXT"
          mkdir -p "$LINUX_CONTEXT/dist" "$LINUX_CONTEXT/packaging" "$LINUX_CONTEXT/docs" "$LINUX_CONTEXT/scripts"
          cp package.json package-lock.json README.md "$LINUX_CONTEXT/"
          cp -R dist/src "$LINUX_CONTEXT/dist/src"
          cp -R packaging/linux "$LINUX_CONTEXT/packaging/linux"
          cp docs/LINUX_SERVICE_DEPLOYMENT.md "$LINUX_CONTEXT/docs/"
          cp scripts/build-linux-service-bundle.sh "$LINUX_CONTEXT/scripts/"
          docker build \
            --file packaging/linux/Dockerfile.bundle \
            --build-arg "KAB_VERSION=${VERSION}" \
            --build-arg "KAB_REVISION=${GITHUB_SHA}" \
            --build-arg "KAB_RUNTIME_ARTIFACT_SHA256=${RUNTIME_ARTIFACT_SHA256}" \
            --tag agent-bridge:linux-bundle-release \
            "$LINUX_CONTEXT"
          CONTAINER_ID="$(docker create agent-bridge:linux-bundle-release)"
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
          docker cp "$CONTAINER_ID:/out/agent-bridge-linux-x64.tar.gz" "$LINUX_ARCHIVE"
          docker rm "$CONTAINER_ID" >/dev/null
          CONTAINER_ID=""
          trap - EXIT

          LINUX_SHA256="$(sha256sum "$LINUX_ARCHIVE" | awk '{print $1}')"
          LINUX_FILE="$(basename "$LINUX_ARCHIVE")"
          printf '%s  %s\n' "$LINUX_SHA256" "$LINUX_FILE" >> release/SHA256SUMS

          LINUX_FILE="$LINUX_FILE" \
          LINUX_SHA256="$LINUX_SHA256" \
          RUNTIME_ARTIFACT_SHA256="$RUNTIME_ARTIFACT_SHA256" \
          node -e '
            const fs = require("node:fs");
            const path = "release/release-manifest.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.linuxService = {
              format: "tar+gzip",
              file: process.env.LINUX_FILE,
              sha256: process.env.LINUX_SHA256,
              platform: "linux/x64/systemd",
              runtimeArtifactSha256: process.env.RUNTIME_ARTIFACT_SHA256,
              releaseDirectory: `sha256-${process.env.RUNTIME_ARTIFACT_SHA256}`,
              applicationBuildSource: "verified prebuilt dist/src",
              dependencyInstall: "production dependency tree built inside pinned Node 22 packaging image from committed lockfile",
            };
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          '

          echo "archive=${LINUX_ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${LINUX_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Build OCI image and extract image SPDX SBOM
        id: oci
        shell: bash
        env:
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.package.outputs.version }}"
          NAME="${{ steps.package.outputs.name }}"
          CONTEXT="${{ steps.package.outputs.context }}"
          OCI_ARCHIVE="release/${NAME}.oci.tar"
          BUILD_METADATA="release/oci-build-metadata.json"
          OCI_LAYOUT="release/oci-layout"
          OCI_SBOM="release/oci-sbom.spdx.json"
          OCI_SBOM_METADATA="release/oci-sbom-metadata.json"

          if [[ -n "${COMMIT_TIMESTAMP:-}" ]]; then
            SOURCE_DATE_EPOCH="$(date -d "$COMMIT_TIMESTAMP" +%s)"
          else
            SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          fi

          docker buildx build \
            --platform linux/amd64 \
            --file packaging/docker/Dockerfile.release \
            --build-arg "KAB_VERSION=${VERSION}" \
            --build-arg "KAB_REVISION=${GITHUB_SHA}" \
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            --provenance=false \
            --sbom=true \
            --metadata-file "${BUILD_METADATA}" \
            --output "type=oci,dest=${OCI_ARCHIVE},name=agent-bridge:${VERSION}" \
            "${CONTEXT}"

          OCI_ARCHIVE_SHA256="$(sha256sum "${OCI_ARCHIVE}" | awk '{print $1}')"
          OCI_EXPORT_DIGEST="$(node -e '
            const fs = require("node:fs");
            const metadata = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const digest = metadata["containerimage.digest"];
            if (typeof digest !== "string" || !/^sha256:[a-f0-9]{64}$/i.test(digest)) process.exit(1);
            process.stdout.write(digest.toLowerCase());
          ' "${BUILD_METADATA}")"

          mkdir -p "${OCI_LAYOUT}"
          tar -xf "${OCI_ARCHIVE}" -C "${OCI_LAYOUT}"
          node scripts/extract-oci-sbom.mjs \
            "${OCI_LAYOUT}" \
            "${OCI_SBOM}" \
            linux amd64 > "${OCI_SBOM_METADATA}"

          OCI_PLATFORM_MANIFEST_DIGEST="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).platformManifestDigest' "${OCI_SBOM_METADATA}")"
          OCI_ATTESTATION_MANIFEST_DIGEST="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).attestationManifestDigest' "${OCI_SBOM_METADATA}")"
          OCI_SBOM_BLOB_DIGEST="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).sbomBlobDigest' "${OCI_SBOM_METADATA}")"
          OCI_SBOM_PACKAGE_COUNT="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).packageCount' "${OCI_SBOM_METADATA}")"
          OCI_SBOM_SHA256="$(sha256sum "${OCI_SBOM}" | awk '{print $1}')"

          printf '%s  %s\n' "${OCI_ARCHIVE_SHA256}" "${NAME}.oci.tar" >> release/SHA256SUMS
          printf '%s  %s\n' "${OCI_SBOM_SHA256}" "oci-sbom.spdx.json" >> release/SHA256SUMS

          OCI_FILE="${NAME}.oci.tar" \
          OCI_ARCHIVE_SHA256="${OCI_ARCHIVE_SHA256}" \
          OCI_EXPORT_DIGEST="${OCI_EXPORT_DIGEST}" \
          OCI_PLATFORM_MANIFEST_DIGEST="${OCI_PLATFORM_MANIFEST_DIGEST}" \
          OCI_ATTESTATION_MANIFEST_DIGEST="${OCI_ATTESTATION_MANIFEST_DIGEST}" \
          OCI_SBOM_BLOB_DIGEST="${OCI_SBOM_BLOB_DIGEST}" \
          OCI_SBOM_PACKAGE_COUNT="${OCI_SBOM_PACKAGE_COUNT}" \
          OCI_SBOM_SHA256="${OCI_SBOM_SHA256}" \
          node -e '
            const fs = require("node:fs");
            const path = "release/release-manifest.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.ociImage = {
              format: "OCI image layout tar",
              file: process.env.OCI_FILE,
              archiveSha256: process.env.OCI_ARCHIVE_SHA256,
              exportDigest: process.env.OCI_EXPORT_DIGEST,
              manifestDigest: process.env.OCI_PLATFORM_MANIFEST_DIGEST,
              platform: "linux/amd64",
              applicationBuildSource: "release/stage prebuilt dist/src",
              sbom: {
                format: "SPDX",
                file: "oci-sbom.spdx.json",
                sha256: process.env.OCI_SBOM_SHA256,
                scope: "container-image",
                subjectManifestDigest: process.env.OCI_PLATFORM_MANIFEST_DIGEST,
                attestationManifestDigest: process.env.OCI_ATTESTATION_MANIFEST_DIGEST,
                sbomBlobDigest: process.env.OCI_SBOM_BLOB_DIGEST,
                packageCount: Number(process.env.OCI_SBOM_PACKAGE_COUNT),
              },
            };
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
            fs.writeFileSync(
              "release/oci-image.json",
              JSON.stringify(manifest.ociImage, null, 2) + "\n",
            );
          '

          rm -rf "${OCI_LAYOUT}" "${BUILD_METADATA}" "${OCI_SBOM_METADATA}"
          echo "archive=${OCI_ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "manifest-digest=${OCI_PLATFORM_MANIFEST_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "sbom=${OCI_SBOM}" >> "$GITHUB_OUTPUT"

      - name: Verify release checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Attest runtime archive provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attest Linux service bundle provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.linux.outputs.archive }}

      - name: Attest OCI archive provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.oci.outputs.archive }}

      - name: Attest OCI image SPDX SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.oci.outputs.archive }}
          sbom-path: ${{ steps.oci.outputs.sbom }}

      - name: Attest CycloneDX application SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          sbom-path: sbom.cdx.json

      - name: Collect local attestation bundles
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "${RUNNER_TEMP}/created_attestation_paths.txt" ]]; then
            mkdir -p release/attestations
            index=0
            while IFS= read -r attestation; do
              [[ -n "${attestation}" ]] || continue
              index=$((index + 1))
              cp "${attestation}" "release/attestations/attestation-${index}.jsonl"
            done < "${RUNNER_TEMP}/created_attestation_paths.txt"
          fi

      - name: Upload attested release bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.linux.outputs.archive }}
            ${{ steps.oci.outputs.archive }}
            release/SHA256SUMS
            release/release-manifest.json
            release/oci-image.json
            release/oci-sbom.spdx.json
            release/sbom.cdx.json
            release/attestations
          if-no-files-found: error
          retention-days: 90
